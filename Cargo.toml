[package]
name = "emergency-kit"
version = "0.1.0"
edition = "2024"
description = "Offline knowledge and entertainment installer"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "emergency_kit"
path = "src/lib.rs"

[[bin]]
name = "kit"
path = "src/main.rs"

[[bin]]
name = "kit-gui"
path = "src/bin/kit-gui.rs"
required-features = ["gui"]

[features]
# The native download manager; off by default so the CLI build stays small.
gui = ["dep:eframe"]

[dependencies]
anyhow = "1.0.104"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
time = "0.3"
clap = { version = "4.6.7", features = ["derive", "env"] }
roxmltree = "0.21.2"
rustix = { version = "1.1.6", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
ureq = "3.5.0"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1.1.10"
tar = { version = "0.4", default-features = false }
eframe = { version = "0.37", optional = true }
ruzstd = "0.9.1"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
