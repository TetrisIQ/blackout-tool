<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline assistant</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  /* set by the portal's reading frame so the page follows its theme switch */
  :root[data-theme=light] { color-scheme: light; }
  :root[data-theme=dark] { color-scheme: dark; }
  /* inside the portal frame the portal header already links home */
  :root.framed a[href="/"] { display: none; }
  body { max-width: 46rem; margin: 0 auto; padding: 0 1rem 6rem; line-height: 1.5; }
  header { display: flex; gap: 1rem; align-items: baseline; flex-wrap: wrap; padding-top: 1rem; }
  header a { margin-right: auto; }
  .notice { border: 1px solid; border-radius: .5rem; padding: .5rem .8rem; font-size: .9rem; margin: .8rem 0; }
  .turn { margin: 1rem 0; }
  .q { font-weight: 600; }
  .a { white-space: pre-wrap; }
  .src { font-size: .85rem; margin-top: .3rem; }
  .src a { margin-right: .8rem; }
  .status { font-size: .85rem; opacity: .75; }
  .timing { font-size: .8rem; opacity: .7; margin-top: .2rem; }
  details.think { font-size: .85rem; opacity: .8; }
  details.think pre { white-space: pre-wrap; margin: .3rem 0; font-family: inherit; }
  label.deep { font-size: .9rem; display: flex; align-items: center; gap: .3rem; white-space: nowrap; }
  form { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: .5rem; padding: .6rem 1rem;
         background: Canvas; border-top: 1px solid; max-width: 46rem; margin: 0 auto; box-sizing: border-box; }
  input { flex: 1; font-size: 1.1rem; padding: .4rem; }
  button { font-size: 1.1rem; padding: .4rem 1rem; }
</style>
<script>if (self !== top) document.documentElement.classList.add('framed');</script>
</head>
<body>
<header>
  <a href="/">Offline kit</a>
  <strong>Assistant</strong> <small id="model"></small>
</header>
<div class="notice">
  In an emergency call <strong>112</strong> (Europe) or <strong>911</strong> (US/CA) first.
  This is a small model that can be wrong. It answers only from the library passages listed under each
  answer; check them yourself, especially for first aid.
</div>
<div id="log"></div>
<form id="form">
  <input id="q" type="text" autocomplete="off" placeholder="Ask a question" required autofocus>
  <label class="deep" id="deepbox" hidden><input type="checkbox" id="deep"> Think harder</label>
  <button id="go" type="submit">Ask</button>
</form>
<script src="rag.js"></script>
<script>
(async () => {
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('q');
  const go = document.getElementById('go');
  const history = [];
  let model = null;
  let thinking = false;
  let books = [];
  const deep = document.getElementById('deep');

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  };

  try {
    const cfg = await (await fetch('config.json')).json();
    model = cfg.model;
    thinking = !!cfg.thinking;
    books = cfg.books || [];
    document.getElementById('model').textContent = model;
    document.getElementById('deepbox').hidden = !thinking;
  } catch (e) {
    log.append(el('p', 'status', 'No assistant is installed.'));
    go.disabled = true;
    return;
  }

  const chat = (body) => fetch('api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    // think defaults to false: hidden reasoning would use up the short answer budget and delay the first word.
    body: JSON.stringify({ model, keep_alive: '30m', think: false, ...body }),
  });

  async function keywords(question) {
    try {
      const r = await chat({ stream: false, messages: Rag.keywordMessages(question),
                             options: Rag.OPTIONS.keywords });
      return Rag.cleanKeywords((await r.json()).message.content, question);
    } catch (e) {
      return Rag.cleanKeywords('', question);
    }
  }

  // `query` is the English keyword string: the library is English, the question may not be.
  const passages = (query, question) => Rag.retrieve(query, async (url) => (await fetch(url)).text(), books, { question });

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const question = input.value.trim();
    if (!question) return;
    input.value = '';
    go.disabled = true;
    const turn = el('div', 'turn');
    const status = el('div', 'status', 'Searching the library ...');
    const answer = el('div', 'a');
    const src = el('div', 'src');
    const timing = el('div', 'timing');
    const reasoning = deep.checked && thinking;
    const thought = el('details', 'think');
    thought.hidden = true;
    thought.append(el('summary', '', 'Reasoning'), el('pre'));
    turn.append(el('div', 'q', question), status, thought, answer, src, timing);
    const t0 = performance.now();
    const secs = (t) => ((t - t0) / 1000).toFixed(1) + ' s';
    let tSearch = 0, tFirst = 0;
    log.append(turn);
    try {
      const query = await keywords(question);
      const { found, used } = await passages(query, question);
      tSearch = performance.now();
      if (found.length === 0) {
        status.textContent = '';
        answer.textContent = 'Nothing about this was found in the installed library (searched: ' + used + '). ' +
          'No answer is given without a source.';
        timing.textContent = 'Search took ' + secs(tSearch) + '; no model call.';
        return;
      }
      status.textContent = 'Reading ' + found.length + ' passage' + (found.length > 1 ? 's' : '') + ' ...';
      const resp = await chat({ stream: true, messages: Rag.buildMessages(question, found, history),
                                think: reasoning,
                                options: reasoning ? Rag.OPTIONS.reasoning : Rag.OPTIONS.answer });
      if (!resp.ok) throw new Error('assistant answered ' + resp.status);
      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      let buf = '', full = '', stats = null, parsed = { state: 'pending' }, shown = false;
      // The reply begins with "SOURCES: ..." naming the passages that really answer; nothing is shown before
      // that line is complete, and an answer without sources (or with "none") is never shown.
      const update = (finished) => {
        parsed = Rag.splitSources(full, found.length, finished);
        if (parsed.state !== 'ok' || parsed.sources.length === 0) return;
        if (!shown) {
          shown = true;
          src.append('Passages used: ');
          parsed.sources.forEach((i) => {
            const a = el('a', '', '[' + (i + 1) + '] ' + found[i].title);
            a.href = found[i].href;
            src.append(a);
          });
        }
        answer.textContent = parsed.body;
        status.textContent = '';
      };
      read: for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, nl).trim();
          buf = buf.slice(nl + 1);
          if (!line) continue;
          const part = JSON.parse(line);
          if (part.message && part.message.thinking) {
            thought.hidden = false;
            thought.querySelector('pre').textContent += part.message.thinking;
            status.textContent = 'Reasoning ...';
          }
          if (part.message && part.message.content) {
            if (!tFirst) tFirst = performance.now();
            full += part.message.content;
            update(false);
            if (parsed.state === 'bad' || (parsed.state === 'ok' && parsed.sources.length === 0)) {
              reader.cancel();
              break read;
            }
          }
          if (part.done) stats = part;
        }
      }
      update(true);
      const end = performance.now();
      if (parsed.state !== 'ok' || parsed.sources.length === 0) {
        status.textContent = '';
        answer.textContent = (parsed.state === 'bad'
          ? 'The assistant did not say which passage its answer comes from, so the answer is not shown.'
          : 'The library has pages that mention these words, but none of them answers the question directly') +
          ' (looked at: ' + found.map((p) => p.title).join('; ') + '). No answer is given without a source.';
        timing.textContent = 'Checked in ' + secs(end) + '; no answer given.';
        return;
      }
      let line = 'Answered in ' + secs(end) + ' (search ' + secs(tSearch) + ', first word ' + secs(tFirst || end) + ')';
      if (stats && stats.eval_count && stats.eval_duration) {
        line += ', ' + stats.eval_count + ' tokens at ' + (stats.eval_count / (stats.eval_duration / 1e9)).toFixed(0) + ' tokens/s';
      }
      timing.textContent = line + (reasoning ? ', with reasoning' : '');
      console.log('assistant timing:', line);
      history.push({ role: 'user', content: question }, { role: 'assistant', content: parsed.body });
      if (history.length > 6) history.splice(0, 2);
    } catch (e) {
      status.textContent = '';
      answer.textContent = 'Something went wrong: ' + e.message + '. Is the assistant (Ollama) running?';
    } finally {
      go.disabled = false;
      input.focus();
    }
  });
})();
</script>
</body>
</html>
