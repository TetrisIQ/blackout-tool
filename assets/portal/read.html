<script>
(function () {
  var frame = document.getElementById('page');
  function target() {
    var t = decodeURI(location.hash.slice(1));
    // A path on this origin, or a service under it (https://<name>.<this host>/): never another site.
    if (/^\/[^\/]/.test(t)) return t;
    try {
      var u = new URL(t);
      if (u.protocol === 'https:' && u.hostname.endsWith('.' + location.hostname)) return u.href;
    } catch (e) {}
    return '/';
  }
  // Dark theme for the article: the frame is inverted as a whole, pictures and video inside it are
  // inverted back so they keep their colours.
  var MEDIA = 'img, video, picture, canvas, iframe, object, embed';
  var css = MEDIA.split(', ').map(function (t) { return 'html.kit-dark ' + t; }).join(', ') +
    ' { filter: invert(1) hue-rotate(180deg); }';
  // Kiwix articles get the inversion; the portal's own pages (/ai/, /maps/) take the theme directly.
  function isArticle(path) { return !/^\/(ai|maps)\//.test(path); }
  function theme() {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    try {
      var d = frame.contentDocument, path = frame.contentWindow.location.pathname;
      var article = isArticle(path);
      frame.classList.toggle('dark', dark && article);
      if (!d || !d.head) return;
      d.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      if (!article) return;
      if (!d.getElementById('kit-dark')) {
        var st = d.createElement('style'); st.id = 'kit-dark'; st.textContent = css; d.head.appendChild(st);
      }
      d.documentElement.classList.toggle('kit-dark', dark);
    } catch (e) { frame.classList.remove('dark'); } // another origin (a service): its own look
  }
  new MutationObserver(theme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  theme();
  frame.src = target();
  frame.addEventListener('load', function () {
    theme();
    if (window.kitTranslate) kitTranslate.onLoad(frame, isArticle);
    try {
      var w = frame.contentWindow, l = w.location;
      history.replaceState(null, '', '#' + l.pathname + l.search + l.hash);
      document.title = (w.document.title ? w.document.title + ' - ' : '') + 'Blackout';
    } catch (e) {}
  });
  window.addEventListener('hashchange', function () {
    var t = target(), cur = null;
    try { var l = frame.contentWindow.location; cur = l.pathname + l.search + l.hash; } catch (e) {}
    if (t === cur) return;
    try { frame.contentWindow.location.replace(t); } catch (e) { frame.src = t; }
  });
})();
</script>
