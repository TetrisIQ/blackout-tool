<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search - Blackout</title>
<script>
{{THEME_JS}}</script>
<style>
{{CSS}}</style>
</head>
<body>
<div class="page">
<header>
  <div class="bar">
    <a class="brand" href="/" aria-label="Blackout home">Blackout</a>
    <form action="/results.html" method="get" style="flex:1 1 220px;max-width:640px;min-width:0">
      <label class="pill">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" name="q" type="search" autocomplete="off" aria-label="Search" placeholder="Search offline" required>
      </label>
    </form>
  </div>
  <span class="tag" id="net"><i></i><b>Offline · all services local</b></span>
  <details class="launcher" id="launcher"{{LAUNCHER_HIDDEN}}>
    <summary aria-label="Services">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="5" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="19" cy="5" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="19" r="1"/><circle cx="12" cy="19" r="1"/><circle cx="19" cy="19" r="1"/></svg>
    </summary>
    <div class="panel">
      <div class="kicker">Local services</div>
      <div class="grid">
{{LAUNCHER}}      </div>
      <button type="button" class="themebtn" id="theme-toggle"><svg class="to-dark" width="14" height="14" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path d="M223.5 32C100 32 0 132.3 0 256S100 480 223.5 480c60.6 0 115.5-24.2 155.8-63.4c5-4.9 6.3-12.5 3.1-18.7s-10.1-9.7-17-8.5c-9.8 1.7-19.8 2.6-30.1 2.6c-96.9 0-175.5-78.8-175.5-176c0-65.8 36-123.1 89.3-153.3c6.1-3.5 9.2-10.5 7.7-17.3s-7.3-11.9-14.3-12.5c-6.3-.5-12.6-.8-19-.8z"/></svg><svg class="to-light" width="14" height="14" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path d="M361.5 1.2c5 2.1 8.6 6.6 9.6 11.9L391 121l107.9 19.8c5.3 1 9.8 4.6 11.9 9.6s1.5 10.7-1.6 15.2L446.9 256l62.3 90.3c3.1 4.5 3.7 10.2 1.6 15.2s-6.6 8.6-11.9 9.6L391 391 371.1 498.9c-1 5.3-4.6 9.8-9.6 11.9s-10.7 1.5-15.2-1.6L256 446.9l-90.3 62.3c-4.5 3.1-10.2 3.7-15.2 1.6s-8.6-6.6-9.6-11.9L121 391 13.1 371.1c-5.3-1-9.8-4.6-11.9-9.6s-1.5-10.7 1.6-15.2L65.1 256 2.8 165.7c-3.1-4.5-3.7-10.2-1.6-15.2s6.6-8.6 11.9-9.6L121 121 140.9 13.1c1-5.3 4.6-9.8 9.6-11.9s10.7-1.5 15.2 1.6L256 65.1 346.3 2.8c4.5-3.1 10.2-3.7 15.2-1.6zM160 256a96 96 0 1 1 192 0 96 96 0 1 1 -192 0zm224 0a128 128 0 1 0 -256 0 128 128 0 1 0 256 0z"/></svg><span>Dark theme</span></button>
    </div>
  </details>
</header>
<main style="flex:1;display:flex;flex-direction:column">
  <nav class="rtabs" id="tabs" role="tablist" aria-label="Sources" hidden><span class="gap"></span><div id="tabbtns"></div></nav>
  <div class="rbody"><span class="gap"></span>
    <div class="rlist" id="list" aria-live="polite"><div class="count" id="count">Searching…</div></div>
  </div>
</main>
<footer>
  <span>Served from this device. No internet connection required.</span>
  <span>Emergency numbers: 112 (EU) · 110 police (DE) · 911 (US/CA)</span>
{{PROVIDERS}}</footer>
</div>
<script>
{{COMMON_JS}}</script>
<script>
{{SPELL_JS}}</script>
<script>
(function () {
  var PAGE = 40, q = new URLSearchParams(location.search).get('q') || '';
  var items = [], total = 0, filter = '', loading = false, failed = false, didYouMean = null;
  var input = document.getElementById('q'), list = document.getElementById('list'), count = document.getElementById('count');
  var tabs = document.getElementById('tabs'), tabbtns = document.getElementById('tabbtns');
  input.value = q; document.title = (q ? q + ' - ' : '') + 'Search - Blackout';
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  // Kiwix puts <b> around the matches inside <description>; keep only those.
  function snippet(desc) {
    var p = el('p'); if (!desc) return p;
    desc.childNodes.forEach(function (n) {
      if (n.nodeType === 1 && n.nodeName.toLowerCase() === 'b') p.appendChild(el('b', null, n.textContent));
      else p.appendChild(document.createTextNode(n.textContent));
    });
    return p;
  }
  function parse(xml) {
    var doc = new DOMParser().parseFromString(xml, 'application/xml');
    var t = doc.getElementsByTagName('opensearch:totalResults')[0] || doc.getElementsByTagName('totalResults')[0];
    total = t ? parseInt(t.textContent, 10) || 0 : 0;
    Array.prototype.forEach.call(doc.getElementsByTagName('item'), function (it) {
      var g = function (n) { var x = it.getElementsByTagName(n)[0]; return x; };
      var book = it.getElementsByTagName('book')[0];
      var link = g('link') ? g('link').textContent : '#';
      var parts = decodeURIComponent(link).replace(/^\/content\//, '').split('/');
      items.push({
        title: g('title') ? g('title').textContent : link, href: link,
        source: book && book.getElementsByTagName('title')[0] ? book.getElementsByTagName('title')[0].textContent : parts[0],
        path: parts.join(' › '), words: g('wordCount') ? g('wordCount').textContent : '', desc: g('description')
      });
    });
  }
  function render() {
    list.textContent = '';
    var sources = [];
    items.forEach(function (r) { if (sources.indexOf(r.source) < 0) sources.push(r.source); });
    tabs.hidden = sources.length < 2;
    tabbtns.textContent = '';
    ['All'].concat(sources).forEach(function (s) {
      var b = el('button', null, s); b.type = 'button'; b.setAttribute('role', 'tab');
      var on = (s === 'All' ? '' : s) === filter; b.setAttribute('aria-selected', on);
      b.onclick = function () { filter = s === 'All' ? '' : s; render(); };
      tabbtns.appendChild(b);
    });
    var shown = items.filter(function (r) { return !filter || r.source === filter; });
    if (failed) list.appendChild(el('div', 'count', 'The search is not available right now.'));
    else if (shown.length) list.appendChild(el('div', 'count', filter ? shown.length + ' results in ' + filter + ' for “' + q + '”' : total + ' results for “' + q + '”'));
    shown.forEach(function (r) {
      var a = el('article', 'res'), s = el('div', 'src');
      s.appendChild(el('span', 'kicker', r.source)); s.appendChild(el('span', 'path', r.path));
      a.appendChild(s);
      var l = el('a', null, r.title); l.href = '/read.html#' + r.href; a.appendChild(l);
      if (r.words) a.appendChild(el('div', 'meta', r.words + ' words'));
      a.appendChild(snippet(r.desc));
      list.appendChild(a);
    });
    if (!shown.length && !failed) {
      if (didYouMean && !filter) {
        var d = el('div', 'dym', 'Did you mean: '), l = el('a', null, didYouMean.text);
        l.href = '/results.html?q=' + encodeURIComponent(didYouMean.text); d.appendChild(l); d.appendChild(document.createTextNode('?'));
        list.appendChild(d);
      }
      var e = el('div', 'empty'); e.appendChild(el('div', 't', 'Nothing ' + (filter ? 'in ' + filter + ' ' : '') + 'for “' + q + '”'));
      if (filter) { var b = el('button', 'btn', 'Show all results'); b.type = 'button'; b.onclick = function () { filter = ''; render(); }; e.appendChild(b); }
      list.appendChild(e);
    }
    if (!failed && items.length < total) {
      var m = el('button', 'btn more', loading ? 'Loading…' : 'More results'); m.type = 'button'; m.disabled = loading; m.onclick = load; list.appendChild(m);
    }
  }
  function load() {
    loading = true; render();
    fetch('/search?pattern=' + encodeURIComponent(q) + '&format=xml&start=' + items.length + '&pageLength=' + PAGE)
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(parse)
      .catch(function () { total = items.length; failed = true; })
      .then(function () { loading = false; render(); })
      .then(suggest);
  }
  // Nothing found: look for a misspelt word in the word index (`kit spell`), if there is one.
  function suggest() {
    if (items.length || failed || didYouMean || typeof Spell === 'undefined') return;
    Spell.create(function (u) { return fetch(u).then(function (r) { return r.ok ? r.text() : null; }); })
      .suggest(q).then(function (s) { if (s) { didYouMean = s; render(); } }, function () {});
  }
  if (q.trim()) load(); else { count.textContent = 'Type something to search.'; input.focus(); }
})();
</script>
</body>
</html>
