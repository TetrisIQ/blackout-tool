<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline maps</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  /* set by the portal's reading frame so the page follows its theme switch */
  :root[data-theme=light] { color-scheme: light; }
  :root[data-theme=dark] { color-scheme: dark; }
  /* inside the portal frame the portal header already links home */
  :root.framed a[href="/"] { display: none; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; }
  header { display: flex; gap: .75rem; align-items: center; padding: .5rem 1rem; flex-wrap: wrap; }
  header a { margin-right: auto; }
  select, button { font-size: 1rem; padding: .3rem .6rem; }
  #pois { display: flex; gap: .25rem .9rem; flex-wrap: wrap; padding: 0 1rem .5rem; font-size: .95rem; }
  #pois label { display: inline-flex; gap: .3rem; align-items: center; cursor: pointer; }
  #pois i { width: .8rem; height: .8rem; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #0006; }
  #find { position: relative; flex: 1 1 14rem; max-width: 26rem; }
  #q { width: 100%; box-sizing: border-box; font-size: 1rem; padding: .3rem .6rem; }
  #hits { position: absolute; z-index: 1000; left: 0; right: 0; top: 100%; margin: 0; padding: 0;
          list-style: none; max-height: 50vh; overflow: auto; background: Canvas; color: CanvasText;
          border: 1px solid GrayText; }
  #hits li { padding: .35rem .6rem; cursor: pointer; }
  #hits li:hover, #hits li.on { background: Highlight; color: HighlightText; }
  #hits small { opacity: .75; }
  #map { flex: 1; min-height: 12rem; }
  #msg { padding: .5rem 1rem; }
  .leaflet-container { font: inherit; }
</style>
<script>if (self !== top) document.documentElement.classList.add('framed');</script>
</head>
<body>
<header>
  <a href="/">Offline kit</a>
  <div id="find"><input id="q" type="search" placeholder="Search a street or place" autocomplete="off" hidden>
    <ul id="hits" hidden></ul></div>
  <label>Region <select id="region"></select></label>
  <button id="locate" type="button">My position</button>
</header>
<div id="pois" aria-label="Points of interest"></div>
<div id="msg" hidden></div>
<div id="map"></div>
<script src="vendor/leaflet.js"></script>
<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/leaflet-maplibre-gl.js"></script>
<script>
(async () => {
  const msg = document.getElementById('msg');
  const fail = (t) => { msg.textContent = t; msg.hidden = false; };
  let regions;
  try {
    regions = await (await fetch('regions.json')).json();
  } catch (e) {
    return fail('The list of installed maps could not be read.');
  }
  if (!regions.length) return fail('No maps are installed.');

  // Points of interest drawn on top of the base map from the `poi` layer of the same tiles.
  // `match` lists OpenMapTiles classes/subclasses; `zoom` is the zoom from which they show.
  const GROUPS = [
    { id: 'water', label: 'Drinking water', color: '#0b6fd6', zoom: 9, match: ['drinking_water'] },
    { id: 'shelter', label: 'Shelter & camping', color: '#2e7d32', zoom: 10, match: ['shelter', 'campsite', 'camp_site', 'caravan_site', 'alpine_hut', 'wilderness_hut'] },
    { id: 'medical', label: 'Medical', color: '#d32f2f', zoom: 10, match: ['hospital', 'clinic', 'doctors', 'pharmacy', 'dentist'] },
    { id: 'emergency', label: 'Police & fire', color: '#6a1b9a', zoom: 10, match: ['police', 'fire_station'] },
    { id: 'supplies', label: 'Food & fuel', color: '#ef6c00', zoom: 12, match: ['supermarket', 'grocery', 'bakery', 'butcher', 'fuel', 'marketplace'] },
    { id: 'toilets', label: 'Toilets', color: '#546e7a', zoom: 12, match: ['toilets'] },
  ];
  const on = Object.fromEntries(GROUPS.map((g) => [g.id, g.id === 'water' || g.id === 'shelter' || g.id === 'medical']));
  const layerOf = (g) => 'kit-poi-' + g.id;

  const box = document.getElementById('pois');
  for (const g of GROUPS) {
    const label = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = on[g.id];
    const dot = document.createElement('i');
    dot.style.background = g.color;
    label.append(cb, dot, g.label);
    cb.addEventListener('change', () => { on[g.id] = cb.checked; applyVisibility(); });
    box.append(label);
  }

  const map = L.map('map', { zoomControl: true, attributionControl: true, maxZoom: 18 });
  const select = document.getElementById('region');
  regions.forEach((r, i) => select.add(new Option(r.name, i)));
  let layer = null, region = null;

  const dark = () => {
    const t = document.documentElement.dataset.theme;
    return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  };

  // The book serves its own tiles, style, fonts and sprites under /content/<book>/. The style
  // names them relative to itself; MapLibre needs absolute URLs.
  async function styleOf(book) {
    const base = location.origin + '/content/' + encodeURIComponent(book) + '/';
    const style = await (await fetch(base + 'assets/' + (dark() ? 'kiwix-dark' : 'kiwix-light'))).json();
    const abs = (u) => (u && u.startsWith('./') ? base + u.slice(2) : u);
    style.sprite = abs(style.sprite);
    style.glyphs = abs(style.glyphs);
    for (const [name, s] of Object.entries(style.sources)) {
      if (s.url) {
        // The TileJSON names its tiles relative to itself too, so inline it with absolute URLs.
        const tj = await (await fetch(abs(s.url))).json();
        tj.tiles = tj.tiles.map((t) => base + t.replace(/^\.\//, ''));
        style.sources[name] = { ...tj, type: s.type };
      } else if (s.tiles) {
        s.tiles = s.tiles.map(abs);
      }
    }
    return style;
  }

  function matchFilter(g) {
    const list = ['literal', g.match];
    return ['any', ['in', ['get', 'class'], list], ['in', ['get', 'subclass'], list]];
  }

  function addPois(gl) {
    for (const g of GROUPS) {
      gl.addLayer({
        id: layerOf(g), type: 'circle', source: 'openmaptiles', 'source-layer': 'poi',
        minzoom: g.zoom, filter: matchFilter(g),
        layout: { visibility: on[g.id] ? 'visible' : 'none' },
        paint: {
          'circle-color': g.color, 'circle-stroke-color': '#fff', 'circle-stroke-width': 2,
          'circle-radius': ['interpolate', ['linear'], ['zoom'], g.zoom, 4, 14, 8],
        },
      });
      gl.addLayer({
        id: layerOf(g) + '-name', type: 'symbol', source: 'openmaptiles', 'source-layer': 'poi',
        minzoom: Math.max(g.zoom + 2, 13), filter: ['all', matchFilter(g), ['has', 'name']],
        layout: {
          visibility: on[g.id] ? 'visible' : 'none',
          'text-field': ['coalesce', ['get', 'name:latin'], ['get', 'name']],
          'text-font': ['Noto Sans Regular'], 'text-size': 11,
          'text-anchor': 'top', 'text-offset': [0, .9], 'text-optional': true,
        },
        paint: { 'text-color': '#222', 'text-halo-color': '#fff', 'text-halo-width': 1.4 },
      });
    }
  }

  function applyVisibility() {
    const gl = layer && layer.getMaplibreMap();
    if (!gl || !gl.getLayer(layerOf(GROUPS[0]))) return;
    for (const g of GROUPS) {
      const v = on[g.id] ? 'visible' : 'none';
      gl.setLayoutProperty(layerOf(g), 'visibility', v);
      gl.setLayoutProperty(layerOf(g) + '-name', 'visibility', v);
    }
  }

  const KINDS = {};
  for (const g of GROUPS) for (const m of g.match) KINDS[m] = g;
  const words = (t) => t.replace(/_/g, ' ');

  // Click on a point of interest: Leaflet owns the pointer events, so ask the GL map what is there.
  map.on('click', (e) => {
    const gl = layer && layer.getMaplibreMap();
    if (!gl) return;
    // The GL canvas is larger than the map (padding), so project the position instead of reusing the click point.
    const p = gl.project([e.latlng.lng, e.latlng.lat]), r = 10;
    const layers = GROUPS.filter((g) => on[g.id]).map(layerOf);
    if (!layers.length) return;
    const hit = gl.queryRenderedFeatures([[p.x - r, p.y - r], [p.x + r, p.y + r]], { layers })[0];
    if (!hit) return;
    const pr = hit.properties, g = KINDS[pr.class] || KINDS[pr.subclass];
    const el = document.createElement('div');
    const title = document.createElement('strong');
    title.textContent = pr.name || (g ? g.label : words(pr.class || 'Place'));
    const sub = document.createElement('div');
    sub.textContent = words(pr.subclass || pr.class || '');
    el.append(title, sub);
    const [lng, lat] = hit.geometry.coordinates;
    L.popup().setLatLng([lat, lng]).setContent(el).openOn(map);
  });

  async function show(i) {
    region = regions[i];
    msg.hidden = true;
    let style;
    try {
      style = await styleOf(region.book);
    } catch (e) {
      return fail('The map ' + region.name + ' could not be read.');
    }
    // Leaflet creates the GL map only once the map has a view, so frame the region first.
    try {
      const c = await (await fetch('/content/' + encodeURIComponent(region.book) + '/content/config.json')).json();
      const [[w, s], [e, n]] = c.boundingBox;
      map.fitBounds([[s, w], [n, e]]);
    } catch (e) {
      if (!map._loaded) map.setView([0, 0], 2);
    }
    if (layer) map.removeLayer(layer);
    layer = L.maplibreGL({
      style,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &middot; OpenFreeMap &middot; OpenMapTiles',
    });
    layer.addTo(map);
    const gl = layer.getMaplibreMap();
    gl.on('error', (e) => console.warn('map:', e.error && e.error.message));
    gl.once('load', () => addPois(gl));
  }
  select.addEventListener('change', () => { show(select.value); resetSearch(); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => show(select.value));
  show(0);

  // Street and place search. The index is split into small files by the first two letters of every
  // word (see src/mapsearch.rs, which also defines `norm`); only the file of what is typed is read.
  const q = document.getElementById('q'), hits = document.getElementById('hits');
  const FOLD = { 'ø': 'o', 'ð': 'd', 'đ': 'd', 'ł': 'l', 'ħ': 'h', 'ŧ': 't', 'ı': 'i', 'ß': 'ss', 'æ': 'ae', 'œ': 'oe', 'þ': 'th' };
  const norm = (t) => t.toLowerCase().replace(/[øðđłħŧıßæœþ]/g, (c) => FOLD[c])
    .normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
  const shardFile = (word) => [...word].slice(0, 2).map((c) => c.codePointAt(0).toString(16)).join('-') + '.json';
  const ZOOM = { country: 5, state: 6, province: 6, region: 8, county: 9, island: 10, city: 12, town: 13,
                 village: 14, suburb: 14, quarter: 14, hamlet: 14, neighbourhood: 15 };
  const shards = new Map();
  let ticket = 0, current = -1, shown = [], found = null;

  async function shard(file) {
    const url = region.search + file;
    if (!shards.has(url)) {
      shards.set(url, fetch(url).then((r) => (r.ok ? r.json() : [])).catch(() => [])
        .then((rows) => rows.map((r) => ({ name: r[0], lon: r[1], lat: r[2], kind: r[3], where: r[4], rank: r[5], key: norm(r[0] + ' ' + r[4]).split(' ') }))));
    }
    return shards.get(url);
  }

  function resetSearch() {
    shards.clear(); ticket++; hits.hidden = true; q.value = '';
    q.hidden = !(regions[select.value] && regions[select.value].search);
  }

  async function search() {
    const mine = ++ticket;
    const tokens = norm(q.value).split(' ').filter(Boolean);
    // Read the file of the longest word first; a very common word ("rue") has no file of its own.
    const leads = tokens.filter((t) => [...t].length >= 2).sort((a, b) => b.length - a.length);
    if (!leads.length || !region.search) { hits.hidden = true; return; }
    // Every typed word has to start a word of the name or of its locality ("grand rue ech").
    shown = [];
    for (const lead of leads) {
      const rows = await shard(shardFile(lead));
      if (mine !== ticket) return;                  // a newer keystroke is already on its way
      for (const r of rows) {                       // rows are sorted: places biggest first, then streets
        if (tokens.every((t) => r.key.some((w) => w.startsWith(t)))) shown.push(r);
        if (shown.length >= 12) break;
      }
      if (shown.length) break;
    }
    hits.replaceChildren();
    shown.forEach((r, i) => {
      const li = document.createElement('li');
      li.textContent = r.name + ' ';
      const small = document.createElement('small');
      small.textContent = [r.where, r.rank > 0 ? r.kind : 'street'].filter(Boolean).join(' \u00b7 ');
      li.append(small);
      li.addEventListener('click', () => pick(i));
      hits.append(li);
    });
    current = -1;
    hits.hidden = !shown.length;
  }

  function pick(i) {
    const r = shown[i];
    if (!r) return;
    hits.hidden = true; q.value = r.name;
    if (found) found.remove();
    found = L.circleMarker([r.lat, r.lon], { radius: 9, color: '#d32f2f', weight: 3, fillOpacity: .25 }).addTo(map);
    found.bindPopup(document.createTextNode(r.name + (r.where ? ', ' + r.where : ''))).openPopup();
    map.setView([r.lat, r.lon], Math.min(r.rank > 0 ? ZOOM[r.kind] || 13 : 17, map.getMaxZoom()));
  }

  let timer = 0;
  q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(search, 120); });
  q.addEventListener('keydown', (e) => {
    const items = [...hits.children];
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!items.length) return;
      e.preventDefault();
      current = (current + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items.forEach((li, i) => li.classList.toggle('on', i === current));
    } else if (e.key === 'Enter' && shown.length) {
      pick(current >= 0 ? current : 0);
    } else if (e.key === 'Escape') {
      hits.hidden = true;
    }
  });
  document.addEventListener('click', (e) => { if (!e.target.closest('#find')) hits.hidden = true; });
  resetSearch();

  let marker = null;
  document.getElementById('locate').addEventListener('click', () => {
    if (!navigator.geolocation) return fail('This browser cannot tell your position.');
    navigator.geolocation.getCurrentPosition((p) => {
      const at = [p.coords.latitude, p.coords.longitude];
      if (marker) marker.remove();
      marker = L.circleMarker(at, { radius: 8 }).addTo(map);
      map.setView(at, 14);
      msg.hidden = true;
    }, () => fail('Your position is not available (no GPS or permission denied).'));
  });
})();
</script>
</body>
</html>
